<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0044D9">
<title>SCL CONNECT 설문 종료</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--primary:#0044D9;--deep:#002A8A}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--primary);color:#fff;
  min-height:100vh;min-height:100dvh;word-break:keep-all;-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(clamp(44px,12vh,112px) + env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) calc(clamp(28px,6vh,56px) + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));
  background:radial-gradient(120% 60% at 100% 0%,rgba(255,255,255,.16),transparent 60%),linear-gradient(180deg,var(--primary) 0%,var(--primary) 55%,var(--deep) 100%)}
.chip{display:inline-block;font-size:13px;font-weight:500;color:rgba(255,255,255,.9);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);padding:6px 12px;border-radius:20px;margin-bottom:14px}
.brand{font-size:clamp(31px,9.6vw,38px);font-weight:800;line-height:1.2;margin:0 0 14px;letter-spacing:-.01em}
h1{font-size:clamp(20px,6.2vw,24px);font-weight:600;line-height:1.5;margin:0;letter-spacing:-.02em}
.card{margin-top:auto;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:22px 20px}
.card .ic{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--primary);display:grid;place-items:center;margin-bottom:14px}
.card b{display:block;font-size:17px;margin-bottom:6px}
.card p{margin:0;font-size:15px;line-height:1.6;opacity:.9}
</style>
</head>
<body>
<main class="app">
  <div>
    <span class="chip">🎁 설문 이벤트</span>
    <div class="brand">SCL CONNECT</div>
    <h1>설문이 종료되었습니다.<br>참여해 주셔서 감사합니다.</h1>
  </div>
  <div class="card">
    <div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <b>이벤트가 마감되었어요</b>
    <p>보내 주신 소중한 의견은 더 나은 서비스를 위해 활용하겠습니다. 앞으로도 SCL에 많은 관심 부탁드립니다.</p>
  </div>
</main>
</body>
</html>
